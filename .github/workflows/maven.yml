# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # Exposed as an env var so later steps can skip SonarCloud analysis when the
      # secret is unavailable (e.g. pull requests from forks).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
    - uses: actions/checkout@v6.1.0
      with:
        # Full history lets SonarCloud attribute issues to authors and compute new-code.
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v6.1.0
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    # verify runs the full suite, including the Dockerized e2e feature tests, so the
    # cross-module JaCoCo aggregate (cujex-coverage) is produced for Sonar to read.
    - name: Build and verify with Maven
      run: mvn -B verify --file pom.xml
    - name: SonarCloud analysis
      # Skipped automatically when SONAR_TOKEN is absent (forked pull requests).
      if: ${{ env.SONAR_TOKEN != '' }}
      run: mvn -B sonar:sonar --file pom.xml

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
