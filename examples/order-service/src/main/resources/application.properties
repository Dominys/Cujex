spring.application.name=order-service

# Expose only the health endpoint; the e2e tests poll it to know the service is up.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Kafka broker. Defaults to localhost for running the app standalone; the e2e
# harness overrides it via the SPRING_KAFKA_BOOTSTRAP_SERVERS env var with the
# Testcontainers broker address (Spring relaxed binding maps the env var here).
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer: send events as JSON. The Jackson 3 based serializer uses Spring Boot's
# Jackson 3 (java.time types supported out of the box). Type headers are disabled so
# the payload is plain, portable JSON the test-side String consumer can read.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer: read status-update commands as JSON. With no type headers on the wire,
# the deserializer is told the concrete target type and which packages to trust.
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=org.dominys.ittests.api.model.StatusUpdateCommand
spring.kafka.consumer.properties.spring.json.trusted.packages=org.dominys.ittests.api.model
